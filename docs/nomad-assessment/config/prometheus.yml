global:
  scrape_interval: 15s
  evaluation_interval: 15s

scrape_configs:
  - job_name: prometheus
    static_configs:
      - targets: ['127.0.0.1:9090']

  - job_name: nomad
    metrics_path: /v1/metrics
    params:
      format: [prometheus]
    # Preserve Nomad's job label, which identifies the workload.
    honor_labels: true
    static_configs:
      - targets: ['127.0.0.1:4646']

  - job_name: consul
    metrics_path: /v1/agent/metrics
    params:
      format: [prometheus]
    static_configs:
      - targets: ['127.0.0.1:8500']

  - job_name: node
    static_configs:
      - targets: ['127.0.0.1:9100']

  - job_name: consul-health
    static_configs:
      - targets: ['127.0.0.1:9107']

  - job_name: hubspot
    consul_sd_configs:
      - server: '127.0.0.1:8500'
        services: [hubspot]
    relabel_configs:
      - source_labels: [__meta_consul_service]
        target_label: service
    # Keep failed instances in discovery, so scrape failures remain visible.

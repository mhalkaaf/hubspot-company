name: Build and deploy staging

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  packages: write

concurrency:
  group: staging-deploy
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - uses: actions/checkout@v4

      - uses: docker/setup-buildx-action@v3

      - name: Set image name
        id: image
        shell: bash
        run: echo "name=ghcr.io/${GITHUB_REPOSITORY,,}" >> "$GITHUB_OUTPUT"

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push immutable image
        id: build
        uses: docker/build-push-action@v6
        with:
          context: .
          file: docker/Dockerfile.staging
          push: true
          platforms: linux/amd64
          tags: ${{ steps.image.outputs.name }}:${{ github.sha }}

      - name: Smoke test image with PostgreSQL
        env:
          IMAGE: ${{ steps.image.outputs.name }}@${{ steps.build.outputs.digest }}
        shell: bash
        run: |
          set -euo pipefail

          cleanup() {
            docker logs assessment-app 2>/dev/null || true
            docker rm -f assessment-app assessment-db >/dev/null 2>&1 || true
            docker network rm assessment >/dev/null 2>&1 || true
          }
          trap cleanup EXIT

          docker run --rm --entrypoint python "$IMAGE" \
            -m compileall -q app.py api models services utils

          docker network create assessment
          docker run -d --name assessment-db --network assessment \
            -e POSTGRES_USER=smoke \
            -e POSTGRES_PASSWORD=smoke \
            -e POSTGRES_DB=smoke \
            postgres:15-alpine

          for attempt in {1..30}; do
            if docker exec assessment-db pg_isready -U smoke -d smoke; then
              break
            fi
            sleep 2
          done
          docker exec assessment-db pg_isready -U smoke -d smoke

          docker run -d --name assessment-app --network assessment \
            -p 127.0.0.1:5104:5104 \
            -e FLASK_ENV=staging \
            -e ENVIRONMENT=staging \
            -e DATABASE_URL=postgresql://smoke:smoke@assessment-db:5432/smoke \
            "$IMAGE" \
            gunicorn --bind 0.0.0.0:5104 --workers 1 --threads 2 app:app

          curl --fail --retry 30 --retry-all-errors --retry-delay 2 \
            http://127.0.0.1:5104/ready
          curl --fail http://127.0.0.1:5104/metrics >/dev/null

      - name: Install deployment SSH credentials
        env:
          SSH_PRIVATE_KEY: ${{ secrets.SSH_PRIVATE_KEY }}
          SSH_KNOWN_HOSTS: ${{ secrets.SSH_KNOWN_HOSTS }}
        shell: bash
        run: |
          set -euo pipefail
          install -d -m 700 ~/.ssh
          printf '%s\n' "$SSH_PRIVATE_KEY" > ~/.ssh/id_ed25519
          printf '%s\n' "$SSH_KNOWN_HOSTS" > ~/.ssh/known_hosts
          chmod 600 ~/.ssh/id_ed25519 ~/.ssh/known_hosts

      - name: Deploy to Nomad through SSH
        env:
          DEPLOY_HOST: ${{ secrets.DEPLOY_HOST }}
          DEPLOY_USER: ${{ secrets.DEPLOY_USER }}
          IMAGE: ${{ steps.image.outputs.name }}@${{ steps.build.outputs.digest }}
        shell: bash
        run: |
          set -euo pipefail
          scp -o BatchMode=yes \
            docs/nomad-assessment/jobs/app.nomad.hcl \
            "$DEPLOY_USER@$DEPLOY_HOST:/tmp/assessment-app.nomad.hcl"
          ssh -o BatchMode=yes "$DEPLOY_USER@$DEPLOY_HOST" \
            "export NOMAD_ADDR=http://127.0.0.1:4646; nomad job validate -var='image=$IMAGE' /tmp/assessment-app.nomad.hcl && nomad job run -var='image=$IMAGE' /tmp/assessment-app.nomad.hcl && curl --fail --retry 10 --retry-all-errors --retry-delay 2 http://127.0.0.1:5104/ready"
